[project]
name = "news"
version = "0.2.0"

requires-python = ">=3.9"
dependencies = [
    "click",
    "feedparser",
    "pyinstaller>=6.15.0",
    "requests",
]

[tool.setuptools.packages.find]
where = ["./"]
include = ["src"]

[project.scripts]
news = "src.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true
